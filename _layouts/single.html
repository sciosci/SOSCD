---
layout: lab
---
<main id="main" class="interior-main wrap">
  {% if page.title and page.title != '' %}
  <header class="page-heading">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </header>
  {% endif %}
  <div class="reading-layout{% if page.toc %} with-toc{% endif %}">
    {% if page.toc %}
    <aside class="contents-nav"><nav aria-label="On this page"><span class="contents-title">On this page</span>{% include toc.html html=content sanitize=true h_min=2 h_max=2 class="contents-list" %}</nav></aside>
    {% endif %}
    <article class="prose page__content">{{ content }}</article>
  </div>
</main>
