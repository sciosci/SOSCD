    description: "New preprint by Almene, with Maria Pacheco and Daniel: <a href=\"https://arxiv.org/abs/2605.29468\">SciIntBench: Measuring LLM Compliance with Research Integrity Norms Under Adversarial Framing</a>"
  - date: "May 3-8, 2026"
    description: "At the <a href=\"https://wcri2026.org/\">9th World Conference on Research Integrity (WCRI 2026)</a> in Vancouver, Canada, Daniel gave the talk <em>Estimating the predictability of questionable journals: signals and interpretation</em> and Pawin presented the poster <em>Identifying Potential Falsified Research Outcomes from Partial Table Duplications</em>"
  - date: "March 2026"
    description: "New preprint by Pawin and Daniel: <a href=\"https://arxiv.org/abs/2604.00248\">REM-CTX: Automated Peer Review via Reinforcement Learning with Auxiliary Context</a>"
