    description: "<em>Widespread reference missingness disparities in open scholarly metadata</em> (Huaxia Zhou, Lizhen Liang, and Daniel) is published in <a href=\"https://doi.org/10.1162/qss.a.400\">Quantitative Science Studies</a>"
