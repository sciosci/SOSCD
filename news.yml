2026:
  - date: "September 28, 2026"
    description: "Daniel will deliver a keynote, <em>AI vs. AI: Guarding the Scientific Record Against Fabrication, Manipulation, and Machine-Authored Content</em>, in the Ethics &amp; Governance in AI for Science track of <a href=\"https://ai4scikorea.org\">AI4Sci Korea 2026</a>, Seoul, South Korea (September 28 – October 1, 2026)"
  - date: "August 2026"
    description: "<em>Dissecting the gender divide: authorship and acknowledgment in scientific publications</em> (Keigo Kusumegi, Daniel, and Yukie Sano) is published in <a href=\"https://doi.org/10.1007/s11192-026-05712-z\">Scientometrics</a>"
  - date: "June 30, 2026"
    description: "Daniel joined the panel <em>The Future Infrastructure of the Scientific Ecosystem</em> (with Jessica Hullman and Aaron Clauset, moderated by Misha Teplitskiy) at the <a href=\"https://www.icssi.org/\">International Conference on the Science of Science and Innovation (ICSSI 2026)</a>, held in Boulder, Colorado, June 29 – July 1"
  - date: "June 29 – July 1, 2026"
    description: "Strong lab presence at <a href=\"https://www.icssi.org/\">ICSSI 2026</a> in Boulder: Almene gave the lightning talk <em>How Willing Are LLMs to Commit Scientific Fraud? A Study of 17 Commercial and Open Models</em>; Christopher presented <em>Quantifying and Understanding Global Disparities in Biomedical Research</em>; Carolina presented <em>Parental Occupation and Socioeconomic Origins in Academic Faculty</em> (with Katie Spoon, Dan Larremore, Daniel, and Aaron Clauset) and a poster on LLM-based gender classification; and Pawin presented the poster <em>Driving Science with Multi-Agents and Reinforcement Learning: Are LLMs Effective for Automated Peer Review?</em>"
  - date: "June 24, 2026"
    description: "<em>Beyond a number game: Flat team structures improve inclusion and performance in diverse scientific teams</em> (Huimin Xu et al., with Daniel) is published in <a href=\"https://doi.org/10.1002/asi.70083\">JASIST</a>"
