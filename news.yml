    description: "NBER working paper <a href=\"https://doi.org/10.3386/w34856\">Government Funding and the Direction of Academic Energy Research</a> (David Popp, Myriam Gregoire-Zawilski, Lizhen Liang, and Daniel), from our Sloan Foundation project, is out"
