10.1162/qss_a_00332:
  key: 10.1162/qss_a_00332
  title: 'Incorporating costs and benefits to the evaluation of uncertain research
    results: applications to cancer research funding'
  alternate_title: ''
  authors: Han Zhuang, Daniel E. Acuna
  author_list:
  - name: Han Zhuang
    given: Han
