taechoyotin2024misti:
  key: taechoyotin2024misti
  title: 'MISTI: Metadata-Informed Scientific Text and Image Representation through
    Contrastive Learning'
  alternate_title: ''
  authors: Pawin Taechoyotin, Daniel Acuna
