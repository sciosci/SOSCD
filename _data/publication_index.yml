lienard2018intellectual:
  key: lienard2018intellectual
  title: Intellectual synthesis in mentorship determines success in academic careers
  alternate_title: ''
  authors: Jean F Liénard, Titipat Achakulvisut, Daniel E Acuna, Stephen V David
  author_list:
  - name: Jean F Liénard
    given: Jean F
