zhuangacuna2021:
  key: zhuangacuna2021
  title: 'Graphical integrity issues in open access publications: detection and patterns
    of proportional ink violations'
  alternate_title: ''
  authors: Han Zhuang, Tzu-Yang Huang, Daniel Ernesto Acuna
