    family: David
  authors_short: Jean F Liénard, Titipat Achakulvisut, Daniel E Acuna, et al.
  year: '2018'
  year_label: '2018'
  format: article
  format_label: ''
  venue: Nature communications
  topics:
  - ecosystem
  tags:
  - mentorship
  - careers
  - interdisciplinarity
  doi: 10.1038/s41467-018-07034-y
  publication_date: '2018-11-27'
  volume: '9'
  issue: '1'
  pages: 1--13
  publisher: Nature Publishing Group
  url: https://www.nature.com/articles/s41467-018-07034-y
  page_path: "/publications/intellectual-synthesis-mentorship/"
  bibtex_path: "/publications/citations/lienard2018intellectual.bib"
  summary: This observational study examines how graduate and postdoctoral mentorship
    relate to later academic careers. It asks whether combining ideas from mentors
    with different expertise predicts a trainee's subsequent success.
  abstract: As academic careers become more competitive, junior scientists need to
    understand the value that mentorship brings to their success in academia. Previous
    research has found that, unsurprisingly, successful mentors tend to train successful
    students. But what characteristics of this relationship predict success, and how?
    We analyzed an open-access database of 18,856 researchers who have undergone both
    graduate and postdoctoral training, compiled across several fields of biomedical
    science with an emphasis on neuroscience. Our results show that postdoctoral mentors
    were more instrumental to trainees’ success compared to graduate mentors. Trainees’
    success in academia was also predicted by the degree of intellectual synthesis
    between their graduate and postdoctoral mentors. Researchers were more likely
    to succeed if they trained under mentors with disparate expertise and integrated
    that expertise into their own work. This pattern has held up over at least 40
    years, despite fluctuations in the number of students and availability of independent
    research positions.
  abstract_license: https://creativecommons.org/licenses/by/4.0/
  reviewed_at: '2026-09-07'
  resources:
  - type: pdf
    url: "/publications/intellectual-synthesis-mentorship/paper.pdf"
  citation: Jean F Liénard, Titipat Achakulvisut, Daniel E Acuna, Stephen V David
    (2018). Intellectual synthesis in mentorship determines success in academic careers.
    Nature communications. https://doi.org/10.1038/s41467-018-07034-y
  bibtex: |+
