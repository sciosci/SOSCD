  bibtex_path: "/publications/citations/acuna2022predicting.bib"
  summary: Code and data links can stop working long after a paper is published. This
    study examines which features of a resource, its host, and its associated publication
    help explain and predict its availability over time.
  abstract: Research has shown that most resources shared in articles (e.g., URLs
    to code or data) are not kept up to date and mostly disappear from the web after
    some years (Zeng et al., 2019). Little is known about the factors that differentiate
    and predict the longevity of these resources. This article explores a range of
    explanatory features related to the publication venue, authors, references, and
    where the resource is shared. We analyze an extensive repository of publications
    and, through web archival services, reconstruct how they looked at different time
    points. We discover that the most important factors are related to where and how
    the resource is shared, while surprisingly little consideration is given to the
    author’s reputation or prestige of the journal. By examining the places where
    long-lasting resources are shared, we suggest that it is critical to educate researchers
    on modern sharing technologies. Finally, we discuss implications for reproducibility
    and acknowledge scientific datasets as first-class citizens of science.
  abstract_license: https://creativecommons.org/licenses/by-nc-nd/4.0/
  reviewed_at: '2026-09-07'
