acuna2010structure:
  key: acuna2010structure
  title: Structure learning in human sequential decision-making
  alternate_title: ''
  authors: Daniel E Acuna, Paul Schrater
  author_list:
  - name: Daniel E Acuna
    given: Daniel E
    family: Acuna
  - name: Paul Schrater
    given: Paul
    family: Schrater
  authors_short: Daniel E Acuna, Paul Schrater
  year: '2010'
  year_label: '2010'
  format: article
  format_label: ''
  venue: PLoS computational biology
  topics:
  - foundations
  tags:
  - decision-making
  - reinforcement-learning
  doi: 10.1371/journal.pcbi.1001003
  publication_date: '2010-12-02'
  volume: '6'
  issue: '12'
  pages: e1001003
  publisher: Public Library of Science San Francisco, USA
  url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1001003
  page_path: "/publications/structure-learning/"
  bibtex_path: "/publications/citations/acuna2010structure.bib"
  summary: Behavior that looks inefficient under a fixed model can make sense when
    a person is also learning how the environment works. This study connects human
    choices in sequential reward tasks with Bayesian models that learn both rewards
    and the structure that generates them.
  abstract: Studies of sequential decision-making in humans frequently find suboptimal
    performance relative to an ideal actor that has perfect knowledge of the model
    of how rewards and events are generated in the environment. Rather than being
    suboptimal, we argue that the learning problem humans face is more complex, in
    that it also involves learning the structure of reward generation in the environment.
    We formulate the problem of structure learning in sequential decision tasks using
    Bayesian reinforcement learning, and show that learning the generative model for
    rewards qualitatively changes the behavior of an optimal learning agent. To test
    whether people exhibit structure learning, we performed experiments involving
    a mixture of one-armed and two-armed bandit reward models, where structure learning
    produces many of the qualitative behaviors deemed suboptimal in previous studies.
    Our results demonstrate humans can perform structure learning in a near-optimal
    manner.
  abstract_license: https://creativecommons.org/licenses/by/4.0/
  reviewed_at: '2026-09-07'
  resources:
  - type: pdf
    url: "/publications/structure-learning/paper.pdf"
  citation: Daniel E Acuna, Paul Schrater (2010). Structure learning in human sequential
    decision-making. PLoS computational biology. https://doi.org/10.1371/journal.pcbi.1001003
  bibtex: |+
    @article{acuna2010structure,
      title = {Structure learning in human sequential decision-making},
      author = {Acuna, Daniel E and Schrater, Paul},
