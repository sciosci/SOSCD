  summary: This data descriptor introduces a resource linking academic mentorship
    relationships to publication records, research representations, and demographic
    estimates. It is designed to support analysis of mentorship and scientific careers.
  abstract: Mentorship in science is crucial for topic choice, career decisions, and
    the success of mentees and mentors. Typically, researchers who study mentorship
    use article co-authorship and doctoral dissertation datasets. However, available
    datasets of this type focus on narrow selections of fields and miss out on early
    career and non-publication-related interactions. Here, we describe Mentorship,
    a crowdsourced dataset of 743176 mentorship relationships among 738989 scientists
    primarily in biosciences that avoids these shortcomings. Our dataset enriches
    the Academic Family Tree project by adding publication data from the Microsoft
    Academic Graph and “semantic” representations of research using deep learning
    content analysis. Because gender and race have become critical dimensions when
    analyzing mentorship and disparities in science, we also provide estimations of
    these factors. We perform extensive validations of the profile–publication matching,
    semantic content, and demographic inferences, which mostly cover neuroscience
    and biomedical sciences. We anticipate this dataset will spur the study of mentorship
    in science and deepen our understanding of its role in scientists’ career outcomes.
  abstract_license: https://creativecommons.org/licenses/by/4.0/
