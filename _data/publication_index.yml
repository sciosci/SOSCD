  year_label: '2021'
  format: article
  format_label: ''
  venue: PloS Computational Biology
  topics:
  - integrity
  tags:
  - figure-integrity
  - graphical-integrity
  doi: 10.1371/journal.pcbi.1009650
  publication_date: '2021-12-13'
  volume: ''
  issue: ''
  pages: ''
  publisher: ''
  url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1009650
  page_path: "/publications/graphical-integrity/"
  bibtex_path: "/publications/citations/zhuangacuna2021.bib"
  summary: 'This study examines violations of the proportional ink principle: the
    amount of visual ink representing a value should agree with that value. It develops
    an automated method for detecting these inconsistencies in scientific bar charts.'
  abstract: Academic graphs are essential for communicating complex scientific ideas
    and results. To ensure that these graphs truthfully reflect underlying data and
    relationships, visualization researchers have proposed several principles to guide
    the graph creation process. However, the extent of violations of these principles
    in academic publications is unknown. In this work, we develop a deep learning-based
    method to accurately measure violations of the proportional ink principle (AUC
    = 0.917), which states that the size of shaded areas in graphs should be consistent
    with their corresponding quantities. We apply our method to analyze a large sample
    of bar charts contained in 300K figures from open access publications. Our results
    estimate that 5% of bar charts contain proportional ink violations. Further analysis
    reveals that these graphical integrity issues are significantly more prevalent
    in some research fields, such as psychology and computer science, and some regions
    of the globe. Additionally, we find no temporal and seniority trends in violations.
    Finally, apart from openly releasing our large annotated dataset and method, we
    discuss how computational research integrity could be part of peer-review and
    the publication processes.
  abstract_license: https://creativecommons.org/licenses/by/4.0/
  reviewed_at: '2026-09-07'
  resources:
  - type: pdf
    url: "/publications/graphical-integrity/paper.pdf"
  - type: code
    url: https://github.com/sciosci/graph_check
  citation: 'Han Zhuang, Tzu-Yang Huang, Daniel Ernesto Acuna (2021). Graphical integrity
    issues in open access publications: detection and patterns of proportional ink
    violations. PloS Computational Biology. https://doi.org/10.1371/journal.pcbi.1009650'
